llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.3

prompt_column_desc_system: "column_desc_system"
prompt_column_desc_human: "column_desc_human"
routing_prompt: "routing_prompt"

database: # Modify DB path
  type: postgresql # Select DB type
  postgresql:
    host: ${PGHOST}
    port: ${PGPORT}
    dbname: ${PGDATABASE}
    user: ${PGUSER}
    password: ${PGPASSWORD}
  # sqlite:
  #   sqlite_path: data/bird_db.sqlite

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  db: ${REDIS_DB}
  password: ${REDIS_PASSWORD}

# Global agent configs
agents:
  causal_discovery:
    bootstrap_iterations: 100
    ci_alpha: 0.05
    violation_threshold: 0.1
    n_subsets: 3
    anm_rf_estimators: 100
    execution_plan_thresholds:
      linearity_score: 0.5         # threshold for s_pairwise_linearity_score
      linearity_pvalue: 0.05       # threshold for s_global_linearity_pvalue
      normality_pvalue: 0.05       # threshold for s_global_normality_pvalue
      non_gaussian_score: 0.5      # threshold for s_pairwise_non_gaussianity_score (LiNGAM)
      anm_score: 0.5               # threshold for s_pairwise_anm_score (ANM)
    composite_weights:
      markov_consistency: 0.4
      sampling_stability: 0.3
      structural_stability: 0.3